name: Daily Trending Post Pipeline

on:
  schedule:
    # Runs every day at 08:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI / Mobile

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TrendBharat Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m trendbharat.scheduler.daily_runner --post-now

      - name: Upload Daily Post Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-post-package
          path: temp/daily_posts/
          if-no-files-found: ignore
          retention-days: 7
